name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run the tests
        run: cargo test --all-targets --locked

      - name: Run the doctests
        run: cargo test --doc --locked

      - name: Run clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build the documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps

      - name: Check what would be published
        run: cargo package --list --locked

      # The fixtures are generated; a change to the generator or a stale file is a
      # review problem, not a build failure, so the diff is the check.
      - name: Regenerate the plist fixtures
        if: matrix.os == 'ubuntu-latest'
        run: python3 tools/plist_fixtures.py

      - name: Check that the fixtures are committed
        if: matrix.os == 'ubuntu-latest'
        run: git diff --exit-code -- tests/fixtures

  msrv:
    name: MSRV 1.85
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the minimum supported Rust
        uses: dtolnay/rust-toolchain@1.85

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      # A dependency that quietly raises its own MSRV would otherwise break the
      # promise before the crate does.
      - name: Check the crate on its minimum supported Rust
        run: cargo check --lib --locked
