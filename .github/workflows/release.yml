name: Publish to crates.io

# Run this from the Actions tab after bumping `version` in Cargo.toml and pushing the
# commit. The token comes from the `CARGO_REGISTRY_TOKEN` repository secret; nothing is
# stored in the repository.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Package and verify without uploading
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-crates-io
  cancel-in-progress: false

jobs:
  publish:
    name: Publish rust-airplay
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      - name: Refuse to publish from outside main
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/main' }}
        run: |
          echo "A real publish has to run from main; this run is on ${{ github.ref }}." >&2
          exit 1

      - name: Run the tests
        run: cargo test --all-targets

      - name: Run the doctests
        run: cargo test --doc

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            cargo publish --dry-run --registry crates-io
          else
            cargo publish --registry crates-io
          fi
