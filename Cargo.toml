[package]
name = "rust-airplay"
description = "A library for building AirPlay 1 and AirPlay 2 receivers: the protocol, the media sessions and the renderer boundary"
repository = "https://github.com/rust-airplay/rust-airplay"
homepage = "https://github.com/rust-airplay/rust-airplay"
documentation = "https://docs.rs/rust-airplay"
readme = "README.md"
include = [
    "/src/**/*.rs",
    "/examples/**/*.rs",
    "/tests/**/*.rs",
    "/tests/fixtures/*.bplist",
    "/docs/**/*.md",
    "/Cargo.toml",
    "/README.md",
    "/README.zh-CN.md",
    "/CHANGELOG.md",
    "/THIRD_PARTY_NOTICES.md",
    "/LICENSE",
]
keywords = ["airplay", "raop", "mirroring", "receiver", "airplay2"]
categories = ["multimedia", "network-programming"]
version = "0.3.1"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
publish = true

[lib]
name = "rust_airplay"
path = "src/lib.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
# A published library documents every public item, and nothing unsafe reaches it.
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = "warn"
# A library does not write to the process's console and does not leave stubs behind.
print_stdout = { level = "deny", priority = -1 }
print_stderr = { level = "deny", priority = -1 }
dbg_macro = { level = "deny", priority = -1 }
todo = { level = "deny", priority = -1 }
unimplemented = { level = "deny", priority = -1 }

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
cbc = "0.1"
cipher = "0.4"
ctr = "0.9"
ed25519-dalek = "2"
getrandom = "0.4"
md-5 = "0.10"
log = "0.4"
mdns-sd = "0.21.4"
num-bigint = "0.4"
num-traits = "0.2"
plist = { version = "1.8.0", default-features = false }
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1.53.1", default-features = false, features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros", "signal"] }
x25519-dalek = "2"

[dev-dependencies]
aes = "0.8"
cbc = "0.1"
cipher = "0.4"
log = "0.4"
proptest = "1.11.0"
